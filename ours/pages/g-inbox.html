<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Lokali · Inbox</title>
  <script src="../shell.config.js"></script>
  <script src="../js/shared/lock-guard.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
  <link rel="stylesheet" href="../css/lokali.css">
  <link rel="stylesheet" href="../css/guest.css">
  <script src="../js/lokali.js"></script>
  <script src="../js/art.js"></script>
  <script src="../js/data.js"></script>
<style>body.m .ib-h { display: flex; align-items: center; gap: 8px; padding: 20px 16px 4px; font: 600 13px/18px var(--font); letter-spacing: .04em; text-transform: uppercase; color: var(--muted); } body.m .ib-h span { font-weight: 600; color: var(--primary); } .ib-h:first-child { padding-top: 8px; } body.m .ib-empty { padding: 24px 16px; color: var(--muted); font-size: 15px; } .ib-in { animation: ibIn .25s var(--ease); } @keyframes ibIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }</style>
</head>
<body class="m">
<div class="lt-bar" aria-hidden="true">Inbox</div>
<header class="lt"><h1>Inbox</h1><p id="ib-sub">2 unread messages</p></header>
<a class="mode-note" id="hostNote" href="h-inbox.html" data-go="h-inbox" hidden><i class="ph ph-house-line" aria-hidden="true"></i><span class="grow">Guest messages · Hosting inbox</span><b>Switch</b></a>
<script>if (L.state.get('hostStatus', 'none') === 'approved') document.getElementById('hostNote').hidden = false;</script>
<!-- grouped list, no filters --><div>
<div class="pad" style="padding-top:8px"><div class="segmented" id="ibf" role="tablist" aria-label="Show"><button class="active" role="tab" aria-selected="true" data-f="all">All</button><button role="tab" aria-selected="false" data-f="trips">Trips</button><button role="tab" aria-selected="false" data-f="enq">Enquiries</button></div></div>
<main id="threads"></main>

<nav class="tabbar" data-tabs="guest" data-active="g-inbox"></nav>
  <script>
  (function () {
var T = [
  ['rahim', 'mangrove', 'Please come at 4:45 so we can fit the life jackets.', '10:32 AM', true, '<span class="badge badge--success">Confirmed · Sun, 6 Dec</span>'],
  ['jenny', 'nyonya', 'Any spice level I should know about? I can make it mild for you.', 'Yesterday', true, '<span class="badge badge--success">Confirmed · Sat, 19 Dec</span>'],
  ['kumar', 'canopy', 'You: Thank you Kumar, the hornbills were unreal.', 'Sat', false, '<span class="badge">Completed</span>'],
  ['meiling', 'paddy', 'Mei Ling: Yes, children are welcome in the field.', '14 Nov', false, '<span class="badge badge--info">Enquiry</span>']
];
function row(t) {
  var p = L.people[t[0].replace('-enq', '')], e = L.exp[t[1]];
  return '<a class="thread' + (L.isUnread(t[0]) ? ' unread' : '') + '" href="g-chat.html" data-go="g-chat" data-thread="' + t[0] + '"><span class="av"><img class="avatar" src="' + L.img(p.img, 120) + '" alt=""><img class="thumb" src="' + L.img(e.img, 80) + '" alt=""></span>' +
    '<span class="body"><span class="top"><b>' + p.name + '</b><time>' + t[3] + '</time></span><span class="xs muted" style="display:block">' + e.title + '</span><span class="prev" style="display:block">' + t[2] + '</span><span style="display:block;margin-top:8px">' + t[5] + '</span></span>' + (t[4] ? '<span class="udot" aria-label="Unread"></span>' : '') + '</a>';
}
  var sent = null; try { sent = sessionStorage.getItem('lk-enq-sent'); } catch (e) {}
  /* one chat per host + experience: an enquiry to a host you've already booked joins the booking chat */
  if (sent) { T[0][2] = 'You: ' + sent; T[0][3] = 'Just now'; }
  var isEnq = function (t) { return /Enquiry/.test(t[5]); };
  var up = T.filter(function (t) { return /Confirmed/.test(t[5]); }), enq = T.filter(isEnq), past = T.filter(function (t) { return !/Confirmed/.test(t[5]) && !isEnq(t); });
  function grp(title, list, show, emptyMsg) { return (show ? '<h2 class="ib-h">' + title + ' <span>' + list.length + '</span></h2>' : '') + (list.length ? list.map(row).join('') : '<p class="ib-empty">' + emptyMsg + '</p>'); }
  function draw(f) {
    var h = '';
    if (f === 'all') h = grp('Upcoming', up, true, 'No upcoming trips.') + grp('Enquiries', enq, true, 'No enquiries.') + grp('Past', past, true, 'No past trips.');
    if (f === 'trips') h = grp('Upcoming', up, true, 'No upcoming trips. <a href="g-home.html" data-go="g-home">Explore experiences ›</a>') + grp('Past', past, true, 'No past trips.');
    if (f === 'enq') h = enq.length ? enq.map(row).join('') : '<p class="ib-empty">No enquiries. Ask a host a question from any experience page.</p>';
    var m = document.getElementById('threads'); m.innerHTML = h; m.classList.remove('ib-in'); void m.offsetWidth; m.classList.add('ib-in');
  }
  document.getElementById('ibf').addEventListener('click', function (e) { var b = e.target.closest('[data-f]'); if (!b) return; this.querySelectorAll('button').forEach(function (x) { var on = x === b; x.classList.toggle('active', on); x.setAttribute('aria-selected', on); }); draw(b.dataset.f); });
  draw('all');
  var n = L.unread(); document.getElementById('ib-sub').textContent = n ? n + ' unread message' + (n > 1 ? 's' : '') : 'All caught up';
  document.getElementById('threads').addEventListener('click', function (e) { var a = e.target.closest('[data-thread]'); if (a) try { sessionStorage.setItem('lk-thread', a.dataset.thread); } catch (x) {} }, true);
  })();
  </script>
  <script>
  (function () { /* compact title appears once the large title scrolls away */
var bar = document.querySelector('.lt-bar'), h = document.querySelector('.lt h1');
function f() { bar.classList.toggle('on', h.getBoundingClientRect().bottom < bar.offsetHeight); }
addEventListener('scroll', f, { passive: true }); f();
  })();
  </script>
  <script src="../js/shared/embed.js"></script>
  <script>if (window.ProtoEmbed) ProtoEmbed.report('g-inbox', [['Threads', '4'], ['Unread', '2']]);</script>
  <script src="../js/shared/credits-data.js"></script>
  <script src="../js/shared/credits-badge.js"></script>
</body>
</html>
