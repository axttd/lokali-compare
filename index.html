<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lokali</title>
  <script src="shell.config.js"></script>
  <script src="js/shell/split.js"></script>
  <link rel="stylesheet" href="css/shell/prototype.css">
  <link rel="stylesheet" href="css/shell/admin-shell.css">
  <link rel="stylesheet" href="css/shell/phone-frame.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=chevron_right,lock,replay,warning">
</head>
<body>
  <!-- Lock screen: covers the whole page until the password is in -->
  <iframe id="lockscreen" class="lockscreen" src="pages/lock.html" title="Lock screen"></iframe>
  <div class="shell">

    <!-- Left: page list and controls -->
    <aside class="side side--left" id="sideLeft" aria-label="Pages">
      <div class="brand" id="brand"><img class="brand__logo" id="brandLogo" alt="" hidden><span class="brand__name" id="brandName"></span><span class="brand__tag" id="brandTag"></span></div>
      <nav id="pagenav" class="pagenav"></nav>
      <div class="side__actions">
        <button id="relock" class="replay replay--danger" type="button" title="Locks the prototype and resets all progress"><span class="mi" style="font-size:16px" aria-hidden="true">lock</span>Back to lock screen</button>
        <button id="replay" class="replay" type="button"><span class="mi" style="font-size:16px" aria-hidden="true">replay</span><span id="replayLabel">Replay intro</span></button>
      </div>
    </aside>

    <!-- Centre: the screen, where pages load (scaled to fit the window). A device skill draws its frame around it:
         dd-iphone-david (iPhone), dd-iphone-duo-kamil (iPhone Duo); dd-desktop-kamil shows desktop pages full-window.
         Without one, pages show in this plain screen. -->
    <main class="stage" id="stage">
      <div class="phone" id="phone">
        <div class="phone__screen">
          <iframe id="screen" title="Prototype screen" src="about:blank"></iframe>
        </div>
      </div>
    </main>

    <!-- Right: summary of the page on screen. The row above it is the add-on slot: dd-dev-mode-kamil, dd-designer-mode-kamil and
         dd-design-system-kamil put their buttons there (it stays hidden while empty) -->
    <aside class="side side--right" id="sideRight" aria-label="Page summary" aria-live="polite">
      <div class="side__top" id="addons"></div>
      <div id="summary" class="summary"></div>
    </aside>
  </div>

  <!-- Side-card drawers (js/shell/drawers.js): add-ons (admin pages, the open iPhone Duo) show these tabs when the side cards have no room -->
  <button class="edgetab edgetab--left" id="tabNav" type="button" aria-controls="sideLeft" aria-expanded="false" hidden>Navigation</button>
  <button class="edgetab edgetab--right" id="tabSum" type="button" aria-controls="sideRight" aria-expanded="false" hidden>Summary</button>
  <div class="drawerbg" id="drawerBg" hidden></div>

  <!-- Back to lock screen: confirm, because it resets everything -->
  <div id="relockgate" class="confirm" hidden>
    <div class="confirm__card" role="alertdialog" aria-modal="true" aria-labelledby="rg-title" aria-describedby="rg-warn">
      <div class="confirm__head"><span class="confirm__icon" aria-hidden="true"><span class="mi">lock</span></span><h2 id="rg-title">Back to the lock screen?</h2></div>
      <div class="confirm__warn" id="rg-warn" role="alert"><span class="mi" aria-hidden="true" style="font-size:18px;color:#b91c1c">warning</span><p><b>All progress will be reset.</b> Everything done in the prototype is cleared, and it opens from the start after you unlock.</p></div>
      <div class="confirm__act"><button type="button" id="rg-cancel" class="confirm__btn confirm__btn--ghost">Cancel</button><button type="button" id="rg-ok" class="confirm__btn">Reset and lock</button></div>
    </div>
  </div>

  <script src="js/shell/prototype.js"></script>
  <script src="js/shell/phone-frame.js"></script>
  <script src="js/shell/palette.js"></script>
  <script src="js/shell/drawers.js"></script>
  <script src="js/shell/admin-shell.js"></script>
  <script src="js/shell/appearance.js"></script>
  <script src="js/shell/credits.js"></script>
  <script src="js/shared/credits-data.js"></script>
  <script src="js/shared/credits-badge.js"></script>
</body>
</html>
